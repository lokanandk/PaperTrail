<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="280" height="72" role="img" aria-label="PaperTrail">
  <title>PaperTrail</title>

  <defs>
    <linearGradient id="pt-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Mark: a stack of papers with a trail of evidence dots threading through them -->
  <g transform="translate(8, 8)">
    <rect x="10" y="4"  width="34" height="44" rx="4" fill="#cbd5e1" opacity=".55"/>
    <rect x="5"  y="8"  width="34" height="44" rx="4" fill="#94a3b8" opacity=".55"/>
    <rect x="0"  y="12" width="34" height="44" rx="4" fill="#ffffff" stroke="url(#pt-ink)" stroke-width="2.5"/>

    <!-- Text lines on the front sheet -->
    <line x1="7" y1="22" x2="27" y2="22" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="7" y1="29" x2="22" y2="29" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

    <!-- The trail: findings connected across the literature -->
    <path d="M7 44 C 14 44, 14 36, 21 36 S 28 44, 35 40 S 44 26, 52 26"
          fill="none" stroke="url(#pt-ink)" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="7"  cy="44" r="3.2" fill="#2563eb"/>
    <circle cx="21" cy="36" r="3.2" fill="#3b82f6"/>
    <circle cx="35" cy="40" r="3.2" fill="#0ea5e9"/>
    <circle cx="52" cy="26" r="4.2" fill="#0ea5e9" stroke="#ffffff" stroke-width="2"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="90" y="40" font-size="27" font-weight="650" fill="#0f172a" letter-spacing="-0.4">
      Paper<tspan fill="#2563eb">Trail</tspan>
    </text>
    <text x="91" y="56" font-size="10.5" font-weight="500" fill="#64748b" letter-spacing="1.3">
      LITERATURE CONCORDANCE
    </text>
  </g>
</svg>
